<div id="idenfy-verification-status" data-bind="visible: isCheckingStatus" style="display: none;">
    <p data-bind="i18n: 'Checking your verification status...'"></p>
</div>
<div id="idenfy-verification" data-bind="visible: shouldRender() && !isCheckingStatus()" style="display: none;">
    <p data-bind="i18n: 'You need to verify with Idenfy before you can continue with the checkout.'"></p>
    <button class="action primary" type="button" data-bind="
                        click: idenfyRedirect,
                        attr: {title: $t('Start Verification')}
                        " title="Start Verification">
        <span data-bind="i18n: 'Start Verification'">Start Verification</span>
    </button>
</div>
